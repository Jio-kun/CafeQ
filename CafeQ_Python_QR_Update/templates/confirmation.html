{% extends "base.html" %}{% block content %}<div class="card" style="text-align:center;max-width:650px;margin:auto"><div style="font-size:50px">✓</div><span class="eyebrow">ORDER RECEIVED</span><h1>You're in the queue!</h1><p>Hello {{ order.customer }}. Show this code to the staff.</p><div class="eyebrow">ORDER NUMBER</div><div style="font-size:65px;color:#ad7042">#{{ order.number }}</div><p>Validation code</p><div class="code">{{ order.code }}</div><h2>Total: ₱{{ order.total }}</h2><a class="button" href="{{ url_for('my_order') }}">Track My Order</a> <a class="button light" href="{{ url_for('menu') }}">Order More</a></div>{% endblock %}
