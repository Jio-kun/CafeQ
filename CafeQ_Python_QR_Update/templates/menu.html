{% extends "base.html" %}{% block content %}<span class="eyebrow">CAFEQ DIGITAL MENU</span><h1>Good coffee.<br><em>Good mood.</em></h1><div class="grid">{% for item in menu %}<div class="card menu-card"><span class="eyebrow">{{ item.category }}</span><h2>{{ item.name }}</h2><p>{{ item.description }}</p><div class="row"><span class="price">₱{{ item.price }}</span><form method="post" action="{{ url_for('add',item_id=item.id) }}"><button>Add +</button></form></div></div>{% endfor %}</div>{% endblock %}
