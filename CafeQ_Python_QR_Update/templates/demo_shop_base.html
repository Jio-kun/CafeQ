<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ shop.name }} · CafeQ Demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='demo_shops.css') }}">
</head>
<body class="theme-{{ shop.theme }}">
  <header class="shop-header">
    <a class="shop-brand" href="{{ url_for('demo_shop', cafe_slug=shop.slug) }}">{{ shop.name }}</a>
    <nav>
      <a href="{{ url_for('demo_shop', cafe_slug=shop.slug) }}">Menu</a>
      <a href="{{ url_for('demo_shop_cart', cafe_slug=shop.slug) }}">Your order ({{ cart_count|default(0) }})</a>
      <a href="{{ url_for('demo_shop_my_orders', cafe_slug=shop.slug) }}">My orders</a>
      <a href="{{ url_for('demo_shop_live', cafe_slug=shop.slug) }}">Live display</a>
      <a href="{{ url_for('demo_shop_staff_login', cafe_slug=shop.slug) }}">Staff login</a>
      <a href="{{ url_for('demo_cafes') }}">Other demo cafes</a>
    </nav>
  </header>
  <main class="shop-wrap">
    {% for message in get_flashed_messages() %}<p class="shop-flash" role="status">{{ message }}</p>{% endfor %}
    {% block shop_content %}{% endblock %}
  </main>
  <footer class="shop-footer">{{ shop.name }} · Demo shop powered by CafeQ</footer>
</body>
</html>
