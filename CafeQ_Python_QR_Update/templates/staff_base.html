<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CafeQ Staff</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a class="brand" href="{{ url_for('staff') }}">☕ CafeQ Staff</a><nav>{% if session.get('staff_logged_in') %}<a href="{{ url_for('staff') }}">Home</a><a href="{{ url_for('staff_live') }}">Live Display</a><a href="{{ url_for('staff') }}#customer-orders">Customer Orders</a><a href="{{ url_for('staff_cafes') }}">Manage Cafes</a><a href="{{ url_for('qr_page') }}">Cafe QR Codes</a><a href="{{ url_for('staff_logout') }}">Log Out</a>{% else %}<a href="{{ url_for('staff_login') }}">Staff Login</a><a href="{{ url_for('home') }}">Customer Site</a>{% endif %}</nav></header><main class="wrap">{% for msg in get_flashed_messages() %}<div class="flash">{{ msg }}</div>{% endfor %}{% block content %}{% endblock %}</main><div class="footer">CafeQ · Staff Portal</div></body></html>
